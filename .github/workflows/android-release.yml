name: Android Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency: android-release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: bun install --frozen-lockfile
      - run: npx cap add android
      - run: mkdir -p android/app/src/main/assets
      - run: npx cap sync android

      - name: Configure signing & build AAB
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" > /tmp/keystore.b64
            base64 -d /tmp/keystore.b64 > android/app/keystore.jks
            python3 -c "
import os, re
with open('android/app/build.gradle') as f:
    content = f.read()
indent = re.search(r'^(\s*)defaultConfig \{', content, re.MULTILINE).group(1)
sp = os.environ['STORE_PASS']
ka = os.environ['KEY_ALIAS']
kp = os.environ['KEY_PASS']
signing = f'''{indent}signingConfigs {{
{indent}    release {{
{indent}        storeFile file('keystore.jks')
{indent}        storePassword '{sp}'
{indent}        keyAlias '{ka}'
{indent}        keyPassword '{kp}'
{indent}    }}
{indent}}}}
'''
content = re.sub(r'^(\s*)defaultConfig \{', lambda m: signing + m.group(1) + 'defaultConfig {', content, flags=re.MULTILINE)
content = content.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
with open('android/app/build.gradle', 'w') as f:
    f.write(content)
"
          fi
          cd android
          ./gradlew bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: edolearn-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: edolearn-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

