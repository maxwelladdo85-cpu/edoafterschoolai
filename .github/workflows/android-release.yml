name: Android Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency: android-release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: bun install --frozen-lockfile
      - run: npx cap add android
      - run: mkdir -p android/app/src/main/assets
      - run: npx cap sync android

      - name: Configure signing & build AAB
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" > /tmp/keystore.b64
            base64 -d /tmp/keystore.b64 > android/app/keystore.jks
            sed -i "/defaultConfig {/i\
          signingConfigs {\
              release {\
                  storeFile file('keystore.jks')\
                  storePassword '$STORE_PASS'\
                  keyAlias '$KEY_ALIAS'\
                  keyPassword '$KEY_PASS'\
              }\
          }" android/app/build.gradle
            sed -i 's|signingConfig = signingConfigs.debug|signingConfig = signingConfigs.release|' android/app/build.gradle
          fi
          cd android
          ./gradlew bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: edolearn-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: edolearn-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

