name: Android Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency: android-release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: bun install --frozen-lockfile
      - run: rm -rf android && npx cap add android
      - run: mkdir -p android/app/src/main/assets
      - run: npx cap sync android

      - name: Generate splash & icon assets
        run: npx @capacitor/assets@3.0.5 generate

      - name: Build & sign AAB + APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" > /tmp/keystore.b64
            base64 -d /tmp/keystore.b64 > android/app/keystore.jks
            SIGNING_PROPS="-Pandroid.injected.signing.store.file=$(pwd)/android/app/keystore.jks"
            SIGNING_PROPS="$SIGNING_PROPS -Pandroid.injected.signing.store.password=$STORE_PASS"
            SIGNING_PROPS="$SIGNING_PROPS -Pandroid.injected.signing.key.alias=$KEY_ALIAS"
            SIGNING_PROPS="$SIGNING_PROPS -Pandroid.injected.signing.key.password=$KEY_PASS"
          fi
          cd android
          ./gradlew bundleRelease assembleRelease $SIGNING_PROPS

      - uses: actions/upload-artifact@v4
        with:
          name: edolearn-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: edolearn-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      # Uncomment when Play Console secrets are configured (STORE_SETUP.md):
