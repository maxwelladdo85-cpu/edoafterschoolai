name: iOS Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 1.0.1)"
        required: false

concurrency: ios-release

env:
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  BUNDLE_ID: "ng.gov.edosubeb.edolearn"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate iOS native project
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Import Apple distribution certificate
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/EdoLearn.mobileprovision

      - name: Set build number
        run: |
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          npx cap set ios.buildNumber=$BUILD_NUMBER
          npx cap sync ios

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/EdoLearn.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/EdoLearn.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist .github/export-options.plist \
            -allowProvisioningUpdates

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: edolearn-ios-ipa
          path: build/ipa/EdoLearn.ipa
          retention-days: 30

      - name: Upload to App Store Connect
        if: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}
        run: |
          # Decode App Store Connect API key
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 -d > /tmp/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

          xcrun altool --upload-app \
            --file build/ipa/EdoLearn.ipa \
            --apiKey ${{ secrets.APPLE_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APPLE_API_ISSUER_ID }} \
            --type ios
