name: iOS Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency: ios-release

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - run: bun install --frozen-lockfile
      - run: npx cap add ios
      - run: npx cap sync ios

      - name: Install Fastlane & setup signing
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          gem install fastlane -q --no-document

          # Decode Apple API key
          echo "$APPLE_API_KEY_BASE64" | base64 -d > /tmp/AuthKey_$APPLE_API_KEY_ID.p8

          # Configure git auth for Fastlane match (uses current GITHUB_TOKEN)
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

          # Create or download signing certs & provisioning profiles
          fastlane match appstore \
            --app_identifier "ng.gov.edosubeb.edolearn" \
            --git_url "https://github.com/maxwelladdo85-cpu/edoafterschoolai.git" \
            --git_branch "match-certs" \
            --key_id "$APPLE_API_KEY_ID" \
            --issuer_id "$APPLE_API_ISSUER_ID" \
            --readonly false \
            --force_for_new_devices true \
            --skip_docs true

      - name: Build archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
  <key>method</key><string>app-store</string>
  <key>teamID</key><string>'"$APPLE_TEAM_ID"'</string>
  <key>signingStyle</key><string>automatic</string>
  <key>stripSwiftSymbols</key><true/>
  <key>uploadSymbols</key><true/>
</dict></plist>')

      - uses: actions/upload-artifact@v4
        with:
          name: edolearn-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 -d > /tmp/AuthKey_$APPLE_API_KEY_ID.p8
          xcrun altool --upload-app \
            --file "$RUNNER_TEMP/ipa"/*.ipa \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID" \
            --type ios
