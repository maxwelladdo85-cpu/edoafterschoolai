workflows:
  ios-build:
    name: Build iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APPLE_KEY_ID: YW29AY9768
        APPLE_ISSUER_ID: 81b05e99-eb94-4256-b404-186053348cba
        TEAM_ID: UPH4MRP52S
      node: latest
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install Fastlane & setup signing
        script: |
          gem install fastlane -q --no-document
          echo "${APPLE_API_KEY_B64}" | base64 -d > /tmp/AuthKey_${APPLE_KEY_ID}.p8
          ruby -e '
            require "json"
            key = File.read("/tmp/AuthKey_'"$APPLE_KEY_ID"'.p8")
            j = {key_id: "'"$APPLE_KEY_ID"'", issuer_id: "'"$APPLE_ISSUER_ID"'", key: key, in_house: false, duration: 1200}
            File.write("/tmp/api_key.json", JSON.generate(j))
          '
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          fastlane match appstore \
            --app_identifier "ng.gov.edosubeb.edolearn" \
            --git_url "https://github.com/maxwelladdo85-cpu/edoafterschoolai.git" \
            --git_branch "match-certs" \
            --api_key_path /tmp/api_key.json \
            --force_for_new_devices true \
            --skip_docs true
      - name: Build & Archive
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/ios/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="match AppStore ng.gov.edosubeb.edolearn"
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0"><dict>
              <key>method</key><string>app-store</string>
              <key>teamID</key><string>'"$TEAM_ID"'</string>
              <key>signingStyle</key><string>automatic</string>
              <key>stripSwiftSymbols</key><true/>
              <key>uploadSymbols</key><true/>
            </dict></plist>')
    artifacts:
      - build/ios/ipa/*.ipa
