<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1920" width="1920" height="1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00843D"/>
      <stop offset="100%" style="stop-color:#00612E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#E8C547"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1920" fill="url(#bg)"/>

  <!-- Subtle pattern: open book pages -->
  <g transform="translate(960, 780)" opacity="0.08">
    <text font-family="Georgia, serif" font-size="800" fill="white" text-anchor="middle" dominant-baseline="central">📖</text>
  </g>

  <!-- Graduation Cap (Mortarboard) -->
  <g transform="translate(960, 720)" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top of the mortarboard -->
    <polygon points="-120,-20 0,-80 120,-20 0,40" fill="white" stroke="white"/>
    <!-- Bottom band -->
    <rect x="-140" y="-20" width="280" height="24" rx="4" fill="url(#gold)" stroke="url(#gold)"/>
    <!-- Tassel -->
    <line x1="120" y1="-20" x2="160" y2="30" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="160" cy="40" r="8" fill="url(#gold)" stroke="url(#gold)"/>
  </g>

  <!-- Book below the cap -->
  <g transform="translate(960, 900)">
    <!-- Book spine -->
    <rect x="-100" y="-30" width="200" height="160" rx="8" fill="white" opacity="0.95"/>
    <!-- Book spine shadow -->
    <rect x="-100" y="-30" width="16" height="160" rx="8" fill="#ccc" opacity="0.5"/>
    <!-- Book pages lines -->
    <line x1="-70" y1="10" x2="80" y2="10" stroke="#00843D" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
    <line x1="-70" y1="40" x2="80" y2="40" stroke="#00843D" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
    <line x1="-70" y1="70" x2="60" y2="70" stroke="#00843D" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
    <line x1="-70" y1="100" x2="40" y2="100" stroke="#00843D" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Small decorative dots representing learning/achievement -->
  <g fill="url(#gold)" opacity="0.5">
    <circle cx="720" cy="650" r="6"/>
    <circle cx="1200" cy="650" r="6"/>
    <circle cx="680" cy="750" r="4"/>
    <circle cx="1240" cy="750" r="4"/>
    <circle cx="700" cy="700" r="3"/>
    <circle cx="1220" cy="700" r="3"/>
  </g>

  <!-- Title: EdoLearn -->
  <text x="960" y="1120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="120" font-weight="700" fill="white" text-anchor="middle" letter-spacing="4">
    EdoLearn
  </text>

  <!-- Tagline -->
  <text x="960" y="1200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="400" fill="url(#gold)" text-anchor="middle" letter-spacing="2" opacity="0.95">
    Digital learning at Home
  </text>

  <!-- SUBEB branding -->
  <g transform="translate(960, 1380)">
    <rect x="-140" y="-2" width="280" height="1" fill="white" opacity="0.3"/>
    <text x="0" y="40" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="300" fill="white" text-anchor="middle" letter-spacing="6" opacity="0.7">
      EDO SUBEB
    </text>
  </g>
</svg>