<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1920" width="1920" height="1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006633"/>
      <stop offset="100%" stop-color="#00843D"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1920" fill="url(#bg)"/>

  <!-- Subtle decorative circles -->
  <circle cx="200" cy="240" r="320" fill="#FFFFFF" opacity="0.03"/>
  <circle cx="1720" cy="1680" r="400" fill="#FFFFFF" opacity="0.03"/>
  <circle cx="1600" cy="300" r="180" fill="#FFFFFF" opacity="0.02"/>
  <circle cx="320" cy="1600" r="220" fill="#FFFFFF" opacity="0.02"/>

  <!-- Learning Interface Graphic -->

  <!-- Main card mockup -->
  <rect x="560" y="340" width="800" height="520" rx="32" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>

  <!-- Card header -->
  <rect x="560" y="340" width="800" height="72" rx="32" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="560" y="380" width="800" height="32" fill="#FFFFFF" fill-opacity="0.05"/>

  <!-- Header dots -->
  <circle cx="600" cy="376" r="8" fill="#FF6B6B"/>
  <circle cx="632" cy="376" r="8" fill="#FFD93D"/>
  <circle cx="664" cy="376" r="8" fill="#6BCB77"/>

  <!-- Header text line -->
  <rect x="720" y="368" width="240" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.4"/>

  <!-- Subject cards inside mockup -->
  <!-- Math card -->
  <rect x="690" y="440" width="300" height="180" rx="16" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="840" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" opacity="0.9">Mathematics</text>
  <rect x="740" y="530" width="200" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="740" y="555" width="140" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="740" y="580" width="170" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>

  <!-- Science card -->
  <rect x="930" y="440" width="300" height="180" rx="16" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="1080" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" opacity="0.9">Science</text>
  <rect x="980" y="530" width="200" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="980" y="555" width="120" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="980" y="580" width="160" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>

  <!-- Bottom nav bar in mockup -->
  <rect x="560" y="790" width="800" height="70" rx="0" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="560" y="820" width="800" height="40" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Nav icons -->
  <rect x="620" y="806" width="28" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="780" y="806" width="28" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="940" y="806" width="28" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="1100" y="806" width="28" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="1260" y="806" width="28" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>

  <!-- App Logo / Icon -->
  <rect x="860" y="940" width="200" height="200" rx="48" fill="#FFFFFF" fill-opacity="0.15"/>
  <!-- Open book icon in logo -->
  <path d="M910 1040 L960 1000 L1010 1040 L960 1020 Z" fill="#FFFFFF" opacity="0.9"/>
  <rect x="930" y="990" width="60" height="8" rx="4" fill="#FFFFFF" opacity="0.6"/>
  <rect x="930" y="1010" width="40" height="8" rx="4" fill="#FFFFFF" opacity="0.4"/>

  <!-- App Name -->
  <text x="960" y="1240" text-anchor="middle" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF" letter-spacing="4">EdoLearn</text>

  <!-- Tagline -->
  <text x="960" y="1330" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#FFFFFF" opacity="0.7">Edo State Digital Learning Platform</text>

  <!-- Loading indicator -->
  <rect x="760" y="1450" width="400" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.15"/>
  <rect x="760" y="1450" width="160" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.6"/>

  <!-- Decorative floating elements -->
  <g opacity="0.08">
    <text x="240" y="800" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF">A + B = C</text>
    <text x="1580" y="600" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF">H₂O</text>
    <text x="280" y="1200" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF">∑ π r²</text>
    <text x="1500" y="1300" font-family="Arial, sans-serif" font-size="26" fill="#FFFFFF">2x + 3 = 7</text>
  </g>
</svg>
