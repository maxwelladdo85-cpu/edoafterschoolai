<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · EdoLearn</title>
  <meta name="theme-color" content="#00843D" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #00843D 0%, #006b31 100%);
      color: #fff; padding: 1.5rem; text-align: center;
    }
    .card {
      max-width: 28rem; background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 1rem; padding: 2rem;
    }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
    p  { margin: 0 0 1.25rem; opacity: .9; line-height: 1.5; }
    button {
      background: #D4AF37; color: #1a1a1a; border: 0; cursor: pointer;
      padding: .65rem 1.25rem; border-radius: .5rem; font-weight: 600;
    }
    .icon { font-size: 2.5rem; margin-bottom: .5rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You are offline</h1>
    <p>You are offline — your progress has been saved.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
